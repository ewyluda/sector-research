name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FMP_API_KEY: dummy
      X_BEARER_TOKEN: dummy
      ANTHROPIC_API_KEY: dummy
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_dummy
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/ci_dummy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend
      - name: Backend unittest suite
        # backend/tests has no __init__.py — discover fails; enumerate explicitly.
        run: python -m unittest $(ls backend/tests/test_*.py | sed 's|/|.|g; s|\.py$||' | tr '\n' ' ')
      - name: Migrations apply from empty and match the models
        working-directory: backend
        env:
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/ci
        run: PYTHONPATH=.. alembic upgrade head && PYTHONPATH=.. alembic check
      - name: End-to-end research run (fake LLM, recorded FMP, real Postgres)
        env:
          PIPELINE_E2E: "1"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: python -m unittest backend.tests.test_pipeline_e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Logic tests
        run: npm test
